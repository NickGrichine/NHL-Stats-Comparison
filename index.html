<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compare any NHL skater, goalie or team from any season since 1917-18 with era-adjusted percentile radar charts."
    />
    <meta name="theme-color" content="#f6f8fc" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%92%3C/text%3E%3C/svg%3E" />
    <title>NHL Stats Comparison</title>
    <script>
      // Applied before first paint so the page never flashes dark before
      // ThemeToggle's effect runs. Mirrors ThemeToggle's own default: light,
      // unless the visitor previously chose dark.
      (function () {
        try {
          var stored = localStorage.getItem('nhl-comparison-theme');
          if (stored === 'dark') document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
